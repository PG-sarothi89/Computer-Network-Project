! ================================================================
! GLOBALTECH INDUSTRIES LTD. - BR12 COXS-BAZAR BRANCH ROUTER
! Model: Cisco 2911 ISR | OSPF Area 0
! LAN: 10.1.12.0/24  Gateway: 10.1.12.1
! Primary WAN: 172.16.12.0/30  (to HQ-EDGE-R2)
! PCs: 5 wired + wireless clients via AP
! ================================================================
enable
configure terminal

hostname BR12-R
no ip domain-lookup
ip domain-name globaltech.local
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption

username admin privilege 15 secret GlobalTech@2026Admin
enable secret GlobalTech@2026Enable

! --- LAN Interface (Wired + Wireless AP share this subnet) ---
interface GigabitEthernet0/0
 description BR12-LAN-COXS-BAZAR
 ip address 10.1.12.1 255.255.255.0
 ip helper-address 10.10.70.10
 no shutdown

! --- Primary WAN Link ---
interface Serial0/0/0
 description WAN-PRIMARY-TO-HQ
 ip address 172.16.12.2 255.255.255.252
 ip ospf cost 10
 no shutdown

! --- OSPF Dynamic Routing ---
router ospf 10
 router-id 10.1.12.1
 network 10.1.12.0 0.0.0.255 area 0
 network 172.16.12.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0

! --- Security ACL ---
ip access-list extended ACL-BR12-SECURITY
 remark === Branch COXS-BAZAR Outbound Security Policy ===
 remark DENY access to Management VLAN
 deny   ip 10.1.12.0 0.0.0.255 10.10.60.0 0.0.0.255
 remark PERMIT DNS (TCP+UDP 53)
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.20 eq 53
 permit udp 10.1.12.0 0.0.0.255 host 10.10.70.20 eq 53
 remark PERMIT DHCP
 permit udp 10.1.12.0 0.0.0.255 host 10.10.70.10 eq 67
 remark PERMIT HTTP/HTTPS to Web Server
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.50 eq 80
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.50 eq 443
 remark PERMIT FTP to File Server
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.30 eq 21
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.30 eq 20
 remark PERMIT SMTP/POP3 to Mail Server
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.40 eq 25
 permit tcp 10.1.12.0 0.0.0.255 host 10.10.70.40 eq 110
 remark PERMIT NTP
 permit udp 10.1.12.0 0.0.0.255 host 10.10.70.60 eq 123
 remark PERMIT ICMP for troubleshooting
 permit icmp any any
 remark PERMIT all other traffic
 permit ip any any
exit
interface GigabitEthernet0/0
 ip access-group ACL-BR12-SECURITY in

! --- NTP and Syslog ---
logging 10.10.70.60
ntp server 10.10.70.60

! --- SSH Management ---
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 logging synchronous
exit
line con 0
 password GlobalTech@Console
 login
 logging synchronous
exit

banner motd #
==================================================================
  GLOBALTECH INDUSTRIES LTD. - BR12 COXS-BAZAR
  UNAUTHORIZED ACCESS IS PROHIBITED AND STRICTLY MONITORED!
  All activities are logged and audited.
==================================================================
#

end
write memory
