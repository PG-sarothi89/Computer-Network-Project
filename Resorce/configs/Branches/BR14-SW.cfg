! ================================================================
! GLOBALTECH INDUSTRIES LTD. - BR14 DINAJPUR ACCESS SWITCH
! Model: Cisco 2960 (Layer 2)
! Fa0/1-Fa0/5 = Wired PCs | Fa0/6 = Wireless AP | Gig0/1 = Uplink
! Port Security: Sticky MAC, max 2, violation restrict
! ================================================================
enable
configure terminal

hostname BR14-SW
no ip domain-lookup
service password-encryption

! --- Uplink to Branch Router ---
interface GigabitEthernet0/1
 description UPLINK-TO-BR14-R
 switchport mode access
 spanning-tree portfast
 no shutdown

! --- Wired PC Ports (5 PCs) with Port Security ---
interface FastEthernet0/1
 description BR14-PC1
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

interface FastEthernet0/2
 description BR14-PC2
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

interface FastEthernet0/3
 description BR14-PC3
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

interface FastEthernet0/4
 description BR14-PC4
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

interface FastEthernet0/5
 description BR14-PC5
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

! --- Wireless Access Point Port ---
interface FastEthernet0/6
 description BR14-WIRELESS-AP
 switchport mode access
 spanning-tree portfast
 no shutdown

! --- Disable Unused Ports (Security Hardening) ---
interface range FastEthernet0/7-24
 description UNUSED-DISABLED
 shutdown
 switchport mode access
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown

interface GigabitEthernet0/2
 description UNUSED
 shutdown

! --- Management SVI ---
interface Vlan1
 ip address 10.1.14.250 255.255.255.0
 no shutdown
ip default-gateway 10.1.14.1

! --- SSH Management ---
ip domain-name globaltech.local
username admin privilege 15 secret GlobalTech@2026Admin
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
exit
line con 0
 password GlobalTech@Console
 login
exit

! --- NTP and Syslog ---
logging 10.10.70.60
ntp server 10.10.70.60

banner motd #
==================================================================
  GLOBALTECH - BR14-SW DINAJPUR | PORT SECURITY ENABLED
  Unauthorized port connections are logged and restricted.
==================================================================
#

end
write memory
