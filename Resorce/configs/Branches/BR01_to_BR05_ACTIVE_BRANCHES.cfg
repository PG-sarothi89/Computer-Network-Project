! ================================================================
! BRANCH ACCESS SWITCH TEMPLATE (Apply to BR01-SW through BR05-SW)
! Model: Cisco 2960 (Layer 2 Switch)
! ================================================================
! Example for BR01-SW (repeat for BR02-SW through BR05-SW)

enable
configure terminal

hostname BR01-SW
no ip domain-lookup

interface GigabitEthernet0/1
 description UPLINK-TO-BR01-R
 switchport mode access
 no shutdown

interface FastEthernet0/1
 description BR01-PC1
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown

interface FastEthernet0/2
 description BR01-PC2
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown

interface FastEthernet0/3
 description BR01-PC3
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown

interface FastEthernet0/4
 description BR01-PC4
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown

! Disable unused ports
interface range FastEthernet0/5-24
 shutdown

banner motd #
==================================================================
  GLOBALTECH - BR01-SW CHATTOGRAM | PORT SECURITY ENABLED
==================================================================
#

end
write memory
