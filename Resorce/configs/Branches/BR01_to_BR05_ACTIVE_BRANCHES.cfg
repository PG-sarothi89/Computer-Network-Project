! ================================================================
! GLOBALTECH INDUSTRIES LTD. - ACTIVE BRANCH CONFIGURATIONS
! Branches BR01 through BR05 (Fully Configured for Demonstration)
! Each branch: 1 Router (2901/2911) + 1 Access Switch (2960) + 4 PCs
! ================================================================


! ================================================================
! BR01 - CHATTOGRAM BRANCH ROUTER
! LAN: 10.1.1.0/24 | Gateway: 10.1.1.1
! Primary WAN: 172.16.1.0/30 (to HQ-EDGE-R1)
! Backup WAN:  172.16.101.0/30 (to HQ-EDGE-R2)
! ================================================================
enable
configure terminal

hostname BR01-R
no ip domain-lookup
ip domain-name globaltech.local
username admin privilege 15 secret GlobalTech@2026Admin
enable secret GlobalTech@2026Enable

interface GigabitEthernet0/0
 description BR01-LAN
 ip address 10.1.1.1 255.255.255.0
 ip helper-address 10.10.70.10
 no shutdown

interface Serial0/0/0
 description WAN-PRIMARY-TO-HQ-R1
 ip address 172.16.1.2 255.255.255.252
 ip ospf cost 10
 crypto map CMAP-GLOBALTECH
 no shutdown

interface Serial0/0/1
 description WAN-BACKUP-TO-HQ-R2
 ip address 172.16.101.2 255.255.255.252
 ip ospf cost 100
 no shutdown

! IPSec VPN (BR01 <-> HQ)
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
exit
crypto isakmp key GlobalTechIPSecSecret2026 address 172.16.1.1
crypto ipsec transform-set TS-GLOBALTECH esp-aes esp-sha-hmac
 mode tunnel
exit
ip access-list extended ACL-IPSEC-VPN
 permit ip 10.1.1.0 0.0.0.255 10.10.0.0 0.0.255.255
exit
crypto map CMAP-GLOBALTECH 10 ipsec-isakmp
 set peer 172.16.1.1
 set transform-set TS-GLOBALTECH
 match address ACL-IPSEC-VPN
exit

router ospf 10
 router-id 10.1.1.1
 network 10.1.1.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.3 area 0
 network 172.16.101.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0

! Port Security on Access Switch Uplink
interface GigabitEthernet0/1
 description TRUNK-TO-BR01-SW
 no shutdown

! ACL: Deny branch users from accessing Management VLAN 60
ip access-list extended ACL-BR01-SECURITY
 deny   ip 10.1.1.0 0.0.0.255 10.10.60.0 0.0.0.255
 permit ip any any
exit
interface GigabitEthernet0/0
 ip access-group ACL-BR01-SECURITY in

! SSH, NTP, Syslog
crypto key generate rsa modulus 2048
ip ssh version 2
logging 10.10.70.60
ntp server 10.10.70.60
line vty 0 4
 login local
 transport input ssh
exit
line con 0
 password GlobalTech@Console
 login
exit

banner motd #
==================================================================
  GLOBALTECH - BR01 CHATTOGRAM | AUTHORIZED ACCESS ONLY
==================================================================
#
end
write memory


