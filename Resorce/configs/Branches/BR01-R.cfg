! ================================================================
! GLOBALTECH INDUSTRIES LTD. - BR01 CHATTOGRAM BRANCH ROUTER
! Model: Cisco 2911 ISR | OSPF Area 0
! LAN: 10.1.1.0/24  Gateway: 10.1.1.1
! Primary WAN: 172.16.1.0/30  (to HQ-EDGE-R1)
! Backup  WAN: 172.16.101.0/30  (to HQ-EDGE-R2)
! PCs: 5 wired + wireless clients via AP
! ================================================================
enable
configure terminal

hostname BR01-R
no ip domain-lookup
ip domain-name globaltech.local
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption

username admin privilege 15 secret GlobalTech@2026Admin
enable secret GlobalTech@2026Enable

! --- LAN Interface (Wired + Wireless AP share this subnet) ---
interface GigabitEthernet0/0
 description BR01-LAN-CHATTOGRAM
 ip address 10.1.1.1 255.255.255.0
 ip helper-address 10.10.70.10
 no shutdown

! --- Primary WAN Link ---
interface Serial0/0/0
 description WAN-PRIMARY-TO-HQ
 ip address 172.16.1.2 255.255.255.252
 ip ospf cost 10
 no shutdown
 crypto map CMAP-GLOBALTECH

! --- Backup WAN Link (higher OSPF cost) ---
interface Serial0/0/1
 description WAN-BACKUP-TO-HQ
 ip address 172.16.101.2 255.255.255.252
 ip ospf cost 100
 no shutdown

! --- IPSec Site-to-Site VPN (BR01 <-> HQ Demo Tunnel) ---
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
exit
crypto isakmp key GlobalTechIPSecSecret2026 address 172.16.1.1
crypto ipsec transform-set TS-GLOBALTECH esp-aes esp-sha-hmac
 mode tunnel
exit
ip access-list extended ACL-IPSEC-VPN
 permit ip 10.1.1.0 0.0.0.255 10.10.0.0 0.0.255.255
exit
crypto map CMAP-GLOBALTECH 10 ipsec-isakmp
 set peer 172.16.1.1
 set transform-set TS-GLOBALTECH
 match address ACL-IPSEC-VPN
exit

! --- OSPF Dynamic Routing ---
router ospf 10
 router-id 10.1.1.1
 network 10.1.1.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.3 area 0
 network 172.16.101.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0

! --- Security ACL ---
ip access-list extended ACL-BR01-SECURITY
 remark === Branch CHATTOGRAM Outbound Security Policy ===
 remark DENY access to Management VLAN
 deny   ip 10.1.1.0 0.0.0.255 10.10.60.0 0.0.0.255
 remark PERMIT DNS (TCP+UDP 53)
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.20 eq 53
 permit udp 10.1.1.0 0.0.0.255 host 10.10.70.20 eq 53
 remark PERMIT DHCP
 permit udp 10.1.1.0 0.0.0.255 host 10.10.70.10 eq 67
 remark PERMIT HTTP/HTTPS to Web Server
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.50 eq 80
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.50 eq 443
 remark PERMIT FTP to File Server
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.30 eq 21
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.30 eq 20
 remark PERMIT SMTP/POP3 to Mail Server
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.40 eq 25
 permit tcp 10.1.1.0 0.0.0.255 host 10.10.70.40 eq 110
 remark PERMIT NTP
 permit udp 10.1.1.0 0.0.0.255 host 10.10.70.60 eq 123
 remark PERMIT ICMP for troubleshooting
 permit icmp any any
 remark PERMIT all other traffic
 permit ip any any
exit
interface GigabitEthernet0/0
 ip access-group ACL-BR01-SECURITY in

! --- NTP and Syslog ---
logging 10.10.70.60
ntp server 10.10.70.60

! --- SSH Management ---
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 logging synchronous
exit
line con 0
 password GlobalTech@Console
 login
 logging synchronous
exit

banner motd #
==================================================================
  GLOBALTECH INDUSTRIES LTD. - BR01 CHATTOGRAM
  UNAUTHORIZED ACCESS IS PROHIBITED AND STRICTLY MONITORED!
  All activities are logged and audited.
==================================================================
#

end
write memory
