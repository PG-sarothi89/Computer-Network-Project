! ================================================================
! GLOBALTECH INDUSTRIES LTD. - HQ EDGE ROUTER 2 (HQ-EDGE-R2)
! Model: Cisco 4331 ISR (with NM-4A/S and HWIC-2T modules added)
! Role: Secondary WAN Aggregation
!       Branches BR11-BR20 (Primary)
!       + Backup WAN for BR01-BR05
! MODULE SETUP IN PACKET TRACER:
!   Power off router -> Physical tab -> Add HWIC-2T modules to slots
!   to provide enough Serial interfaces for all branch WAN links.
! ================================================================
enable
configure terminal

hostname HQ-EDGE-R2
no ip domain-lookup
ip domain-name globaltech.local
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption

username admin privilege 15 secret GlobalTech@2026Admin
enable secret GlobalTech@2026Enable

! --- Core Downlinks ---
interface GigabitEthernet0/0
 description DOWNLINK-TO-HQ-CORE1
 ip address 10.10.100.10 255.255.255.252
 no shutdown

interface GigabitEthernet0/1
 description DOWNLINK-TO-HQ-CORE2
 ip address 10.10.100.16 255.255.255.252
 no shutdown

! --- WAN Links to Regional Branches ---

interface Serial0/0/0
 description WAN-PRIMARY-BR11-BOGRA
 ip address 172.16.11.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/0/1
 description WAN-PRIMARY-BR12-COXS-BAZAR
 ip address 172.16.12.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/1/0
 description WAN-PRIMARY-BR13-JESSORE
 ip address 172.16.13.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/1/1
 description WAN-PRIMARY-BR14-DINAJPUR
 ip address 172.16.14.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/2/0
 description WAN-PRIMARY-BR15-TANGAIL
 ip address 172.16.15.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/2/1
 description WAN-PRIMARY-BR16-BRAHMANBARIA
 ip address 172.16.16.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/3/0
 description WAN-PRIMARY-BR17-NARSINGDI
 ip address 172.16.17.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/3/1
 description WAN-PRIMARY-BR18-SAVAR
 ip address 172.16.18.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/4/0
 description WAN-PRIMARY-BR19-TONGI
 ip address 172.16.19.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/4/1
 description WAN-PRIMARY-BR20-FARIDPUR
 ip address 172.16.20.1 255.255.255.252
 ip ospf cost 10
 clock rate 2000000
 no shutdown

! --- Backup WAN Links for BR01-BR05 (Higher OSPF Cost) ---

interface Serial0/5/0
 description WAN-BACKUP-BR01-CHATTOGRAM
 ip address 172.16.101.1 255.255.255.252
 ip ospf cost 100
 clock rate 2000000
 no shutdown

interface Serial0/5/1
 description WAN-BACKUP-BR02-RAJSHAHI
 ip address 172.16.102.1 255.255.255.252
 ip ospf cost 100
 clock rate 2000000
 no shutdown

interface Serial0/6/0
 description WAN-BACKUP-BR03-KHULNA
 ip address 172.16.103.1 255.255.255.252
 ip ospf cost 100
 clock rate 2000000
 no shutdown

interface Serial0/6/1
 description WAN-BACKUP-BR04-SYLHET
 ip address 172.16.104.1 255.255.255.252
 ip ospf cost 100
 clock rate 2000000
 no shutdown

interface Serial0/7/0
 description WAN-BACKUP-BR05-BARISHAL
 ip address 172.16.105.1 255.255.255.252
 ip ospf cost 100
 clock rate 2000000
 no shutdown

! --- OSPF ---
router ospf 10
 router-id 172.16.0.2
 network 10.10.100.8 0.0.0.3 area 0
 network 10.10.100.16 0.0.0.3 area 0
 network 172.16.11.0 0.0.0.3 area 0
 network 172.16.12.0 0.0.0.3 area 0
 network 172.16.13.0 0.0.0.3 area 0
 network 172.16.14.0 0.0.0.3 area 0
 network 172.16.15.0 0.0.0.3 area 0
 network 172.16.16.0 0.0.0.3 area 0
 network 172.16.17.0 0.0.0.3 area 0
 network 172.16.18.0 0.0.0.3 area 0
 network 172.16.19.0 0.0.0.3 area 0
 network 172.16.20.0 0.0.0.3 area 0
 network 172.16.101.0 0.0.0.3 area 0
 network 172.16.102.0 0.0.0.3 area 0
 network 172.16.103.0 0.0.0.3 area 0
 network 172.16.104.0 0.0.0.3 area 0
 network 172.16.105.0 0.0.0.3 area 0

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
logging 10.10.70.60
ntp server 10.10.70.60
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 logging synchronous
exit
line con 0
 password GlobalTech@Console
 login
 logging synchronous
exit

banner motd #
==================================================================
  GLOBALTECH INDUSTRIES - HQ EDGE ROUTER 2 (SECONDARY WAN)
  UNAUTHORIZED ACCESS IS PROHIBITED AND STRICTLY MONITORED!
==================================================================
#

end
write memory
