! ================================================================
! GLOBALTECH INDUSTRIES LTD. - HQ CORE SWITCH 2 (HQ-CORE2)
! Model: Cisco 3560/3650 (Layer 3 Switch)
! Role: Standby Inter-VLAN Gateway (HSRP), OSPF Core
! 9 VLANs: Admin, Finance, HR, IT, Security/NOC, Mgmt, Servers, Guest, Wireless
! ================================================================
enable
configure terminal

hostname HQ-CORE2
no ip domain-lookup
ip domain-name globaltech.local
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption

username admin privilege 15 secret GlobalTech@2026Admin
enable secret GlobalTech@2026Enable

ip routing

! --- VLAN Database ---
vlan 10
 name ADMINISTRATION
vlan 20
 name FINANCE
vlan 30
 name HUMAN_RESOURCES
vlan 40
 name INFORMATION_TECH
vlan 50
 name SECURITY_NOC
vlan 60
 name MANAGEMENT
vlan 70
 name SERVERS
vlan 80
 name GUEST
vlan 90
 name WIRELESS_HQ
exit

! --- SVI Interfaces with HSRP ---

interface Vlan10
 description HQ-ADMINISTRATION
 ip address 10.10.10.3 255.255.255.0
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 no shutdown

interface Vlan20
 description HQ-FINANCE
 ip address 10.10.20.3 255.255.255.0
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 no shutdown

interface Vlan30
 description HQ-HUMAN_RESOURCES
 ip address 10.10.30.3 255.255.255.0
 standby 30 ip 10.10.30.1
 standby 30 priority 100
 no shutdown

interface Vlan40
 description HQ-INFORMATION_TECH
 ip address 10.10.40.3 255.255.255.0
 standby 40 ip 10.10.40.1
 standby 40 priority 100
 no shutdown

interface Vlan50
 description HQ-SECURITY_NOC
 ip address 10.10.50.3 255.255.255.0
 standby 50 ip 10.10.50.1
 standby 50 priority 100
 no shutdown

interface Vlan60
 description HQ-MANAGEMENT
 ip address 10.10.60.3 255.255.255.0
 standby 60 ip 10.10.60.1
 standby 60 priority 100
 no shutdown

interface Vlan70
 description HQ-SERVERS
 ip address 10.10.70.3 255.255.255.0
 standby 70 ip 10.10.70.1
 standby 70 priority 100
 no shutdown

interface Vlan80
 description HQ-GUEST
 ip address 10.10.80.3 255.255.255.0
 standby 80 ip 10.10.80.1
 standby 80 priority 100
 no shutdown

interface Vlan90
 description HQ-WIRELESS_HQ
 ip address 10.10.90.3 255.255.255.0
 standby 90 ip 10.10.90.1
 standby 90 priority 100
 no shutdown

! --- Inter-Core Link ---
interface GigabitEthernet0/1
 description LINK-TO-HQ-CORE1
 no switchport
 ip address 10.10.99.2 255.255.255.252
 no shutdown

! --- Uplinks to Edge Routers ---
interface GigabitEthernet0/2
 description UPLINK-TO-HQ-EDGE-R1
 no switchport
 ip address 10.10.100.9 255.255.255.252
 no shutdown

interface GigabitEthernet0/3
 description UPLINK-TO-HQ-EDGE-R2
 no switchport
 ip address 10.10.100.13 255.255.255.252
 no shutdown

! --- Trunk Ports to HQ Access Switches ---
interface GigabitEthernet0/4
 description TRUNK-TO-HQ-ACCESS-SW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 no shutdown

interface GigabitEthernet0/5
 description TRUNK-TO-HQ-ACCESS-SW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 no shutdown

! --- OSPF ---
router ospf 10
 router-id 10.10.10.3
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0
 network 10.10.50.0 0.0.0.255 area 0
 network 10.10.60.0 0.0.0.255 area 0
 network 10.10.70.0 0.0.0.255 area 0
 network 10.10.80.0 0.0.0.255 area 0
 network 10.10.90.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.3 area 0
 network 10.10.100.8 0.0.0.3 area 0
 network 10.10.100.12 0.0.0.3 area 0
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan30
 passive-interface Vlan40
 passive-interface Vlan50
 passive-interface Vlan60
 passive-interface Vlan70
 passive-interface Vlan80
 passive-interface Vlan90

! --- DHCP Snooping (Security) ---
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40,50,60,80,90
interface GigabitEthernet0/4
 ip dhcp snooping trust
interface GigabitEthernet0/5
 ip dhcp snooping trust

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 logging synchronous
exit
line con 0
 password GlobalTech@Console
 login
 logging synchronous
exit

logging 10.10.70.60
ntp server 10.10.70.60

banner motd #
==================================================================
  GLOBALTECH INDUSTRIES - HQ CORE SWITCH 2 (STANDBY GATEWAY)
  UNAUTHORIZED ACCESS IS PROHIBITED AND STRICTLY MONITORED!
==================================================================
#

end
write memory
