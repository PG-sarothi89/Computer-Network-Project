! ================================================================
! GLOBALTECH INDUSTRIES LTD. - HQ ACCESS SWITCH 1 (HQ-ACCESS-SW1)
! Model: Cisco 2960-48 (Layer 2)
! Trunk uplinks to CORE1 and CORE2
! Access ports assigned to department VLANs with port security
! ================================================================
enable
configure terminal

hostname HQ-ACCESS-SW1
no ip domain-lookup
service password-encryption

! --- VLAN Database ---
vlan 10
 name ADMINISTRATION
vlan 20
 name FINANCE
vlan 30
 name HUMAN_RESOURCES
vlan 40
 name INFORMATION_TECH
vlan 50
 name SECURITY_NOC
vlan 60
 name MANAGEMENT
vlan 70
 name SERVERS
vlan 80
 name GUEST
vlan 90
 name WIRELESS_HQ
exit

! --- Trunk Uplinks ---
interface GigabitEthernet0/1
 description TRUNK-TO-HQ-CORE1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 no shutdown

interface GigabitEthernet0/2
 description TRUNK-TO-HQ-CORE2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,90
 no shutdown

! --- ADMINISTRATION VLAN 10 (3 PCs) ---
interface range FastEthernet0/1-3
 description HQ-ADMIN-PC
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

! --- FINANCE VLAN 20 (3 PCs) ---
interface range FastEthernet0/4-6
 description HQ-FINANCE-PC
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

! --- HR VLAN 30 (2 PCs) ---
interface range FastEthernet0/7-8
 description HQ-HR-PC
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

! --- SERVER FARM VLAN 70 (6 Servers) ---
interface range FastEthernet0/9-14
 description HQ-SERVER
 switchport mode access
 switchport access vlan 70
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

! --- Wireless AP 1 (HQ) VLAN 90 ---
interface FastEthernet0/15
 description HQ-WIRELESS-AP-1
 switchport mode access
 switchport access vlan 90
 spanning-tree portfast
 no shutdown

! --- Disable Unused Ports ---
interface range FastEthernet0/16-24
 description UNUSED-DISABLED
 shutdown
 switchport mode access
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown

! --- Management SVI ---
interface Vlan60
 ip address 10.10.60.251 255.255.255.0
 no shutdown
ip default-gateway 10.10.60.1

! --- SSH ---
ip domain-name globaltech.local
username admin privilege 15 secret GlobalTech@2026Admin
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
exit
line con 0
 password GlobalTech@Console
 login
exit

logging 10.10.70.60
ntp server 10.10.70.60

banner motd #
==================================================================
  GLOBALTECH - HQ ACCESS SWITCH 1 | PORT SECURITY ENABLED
==================================================================
#

end
write memory
