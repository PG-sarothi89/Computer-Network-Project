! ================================================================
! GLOBALTECH INDUSTRIES LTD. - HQ EDGE ROUTER 1 (HQ-EDGE-R1)
! Model: Cisco 4331 ISR (with NM-4A/S and HWIC-2T modules added)
! Role: Primary WAN Aggregation
!       Branches BR01-BR10 (Primary)
!       + NAT/PAT + IPSec VPN Termination
! MODULE SETUP IN PACKET TRACER:
!   Power off router -> Physical tab -> Add HWIC-2T modules to slots
!   to provide enough Serial interfaces for all branch WAN links.
! ================================================================
enable
configure terminal

hostname HQ-EDGE-R1
no ip domain-lookup
ip domain-name globaltech.local
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption

username admin privilege 15 secret GlobalTech@2026Admin
enable secret GlobalTech@2026Enable

! --- Core Downlinks ---
interface GigabitEthernet0/0
 description DOWNLINK-TO-HQ-CORE1
 ip address 10.10.100.2 255.255.255.252
 ip nat inside
 no shutdown

interface GigabitEthernet0/1
 description DOWNLINK-TO-HQ-CORE2
 ip address 10.10.100.8 255.255.255.252
 ip nat inside
 no shutdown

! --- ISP / Internet Uplink ---
interface GigabitEthernet0/2
 description UPLINK-TO-INTERNET-ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown

ip route 0.0.0.0 0.0.0.0 203.0.113.1

! --- WAN Links to Regional Branches ---

interface Serial0/0/0
 description WAN-PRIMARY-BR01-CHATTOGRAM
 ip address 172.16.1.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown
 crypto map CMAP-GLOBALTECH

interface Serial0/0/1
 description WAN-PRIMARY-BR02-RAJSHAHI
 ip address 172.16.2.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/1/0
 description WAN-PRIMARY-BR03-KHULNA
 ip address 172.16.3.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/1/1
 description WAN-PRIMARY-BR04-SYLHET
 ip address 172.16.4.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/2/0
 description WAN-PRIMARY-BR05-BARISHAL
 ip address 172.16.5.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/2/1
 description WAN-PRIMARY-BR06-RANGPUR
 ip address 172.16.6.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/3/0
 description WAN-PRIMARY-BR07-MYMENSINGH
 ip address 172.16.7.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/3/1
 description WAN-PRIMARY-BR08-COMILLA
 ip address 172.16.8.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/4/0
 description WAN-PRIMARY-BR09-GAZIPUR
 ip address 172.16.9.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

interface Serial0/4/1
 description WAN-PRIMARY-BR10-NARAYANGANJ
 ip address 172.16.10.1 255.255.255.252
 ip nat inside
 ip ospf cost 10
 clock rate 2000000
 no shutdown

! --- IPSec VPN (HQ <-> BR01 Chattogram Demo Tunnel) ---
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
exit
crypto isakmp key GlobalTechIPSecSecret2026 address 172.16.1.2
crypto ipsec transform-set TS-GLOBALTECH esp-aes esp-sha-hmac
 mode tunnel
exit
ip access-list extended ACL-IPSEC-VPN
 permit ip 10.10.0.0 0.0.255.255 10.1.1.0 0.0.0.255
exit
crypto map CMAP-GLOBALTECH 10 ipsec-isakmp
 set peer 172.16.1.2
 set transform-set TS-GLOBALTECH
 match address ACL-IPSEC-VPN
exit

! --- OSPF ---
router ospf 10
 router-id 172.16.0.1
 network 10.10.100.0 0.0.0.3 area 0
 network 10.10.100.8 0.0.0.3 area 0
 network 172.16.1.0 0.0.0.3 area 0
 network 172.16.2.0 0.0.0.3 area 0
 network 172.16.3.0 0.0.0.3 area 0
 network 172.16.4.0 0.0.0.3 area 0
 network 172.16.5.0 0.0.0.3 area 0
 network 172.16.6.0 0.0.0.3 area 0
 network 172.16.7.0 0.0.0.3 area 0
 network 172.16.8.0 0.0.0.3 area 0
 network 172.16.9.0 0.0.0.3 area 0
 network 172.16.10.0 0.0.0.3 area 0
 default-information originate
 passive-interface GigabitEthernet0/2

! --- NAT/PAT ---
ip access-list standard NAT-PERMITTED-NETWORKS
 permit 10.10.0.0 0.0.255.255
 permit 10.1.0.0 0.0.255.255
exit
ip nat inside source list NAT-PERMITTED-NETWORKS interface GigabitEthernet0/2 overload

! --- Guest VLAN Security ACL ---
ip access-list extended ACL-GUEST-RESTRICT
 remark Allow Guest DNS + HTTP/HTTPS only, deny internal
 permit udp 10.10.80.0 0.0.0.255 host 10.10.70.20 eq 53
 permit tcp 10.10.80.0 0.0.0.255 host 10.10.70.20 eq 53
 permit tcp 10.10.80.0 0.0.0.255 host 10.10.70.50 eq 80
 permit tcp 10.10.80.0 0.0.0.255 host 10.10.70.50 eq 443
 deny   ip 10.10.80.0 0.0.0.255 10.10.0.0 0.0.255.255
 deny   ip 10.10.80.0 0.0.0.255 10.1.0.0 0.0.255.255
 permit ip any any
exit

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
logging 10.10.70.60
ntp server 10.10.70.60
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 logging synchronous
exit
line con 0
 password GlobalTech@Console
 login
 logging synchronous
exit

banner motd #
==================================================================
  GLOBALTECH INDUSTRIES - HQ EDGE ROUTER 1 (PRIMARY WAN)
  UNAUTHORIZED ACCESS IS PROHIBITED AND STRICTLY MONITORED!
==================================================================
#

end
write memory
